name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Initialize disposable configuration
        run: make init

      - name: Check formatting and lint
        run: make lint

      - name: Validate Compose
        run: make check

      - name: Run application tests
        run: make test

      - name: Start stack
        run: make up

      - name: Run smoke test
        run: make smoke

      - name: Check Alembic revision and model consistency
        run: |
          docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml exec -T backend alembic current
          docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml exec -T backend alembic check

      - name: Verify backend replacement, proxy discovery and persistent data
        run: |
          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/increment >/dev/null
          docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml up -d --no-deps --force-recreate --wait --wait-timeout 120 backend
          make smoke
          test "$(curl --fail --silent http://127.0.0.1:8080/api/status | jq -r .counter)" -ge 1

      - name: Verify backup and restore
        run: |
          make backup
          backup_file=$(find backups -name '*.dump' -type f | head -n 1)
          make restore FILE="$backup_file" TARGET=restore_ci
          test "$(docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml exec -T postgres psql -U postgres -d restore_ci -Atc 'SELECT value FROM counter WHERE id=1;')" -ge 1
          test "$(docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml exec -T postgres psql -U postgres -d restore_ci -Atc 'SELECT version_num FROM alembic_version;')" = 0001_counter

      - name: Validate Nginx release image
        run: docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml exec -T frontend nginx -t

      - name: Verify development proxy and same-origin POST
        run: |
          make dev
          make smoke
          curl --fail --silent --show-error -X POST -H 'Origin: http://127.0.0.1:8080' http://127.0.0.1:8080/api/increment

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml ps || true
          docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml logs --no-color --tail=200 || true

      - name: Stop stack
        if: always()
        run: docker compose --env-file infra/.env --env-file app/backend/.env --env-file app/frontend/.env -f infra/compose/compose.yaml down -v --remove-orphans || true
