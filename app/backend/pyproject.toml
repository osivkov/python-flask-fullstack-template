[project]
name = "flask-compose-template"
version = "0.1.0"
description = "A Flask application template with SQLAlchemy, Alembic and Docker Compose."
requires-python = ">=3.13,<3.14"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.17,<2",
    "gunicorn>=23,<27",
    "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
